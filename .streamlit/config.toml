[theme]
base                     = "dark"
primaryColor             = "#14B8A6"   # teal — accents, focus rings, primary buttons
backgroundColor          = "#0B0F14"   # near-black canvas
secondaryBackgroundColor = "#131A22"   # cards, expanders, chat bubbles
textColor                = "#E5EDF6"   # off-white body text
font                     = "sans serif"
